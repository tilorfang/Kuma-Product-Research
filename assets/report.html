<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{--bg:#f3f5f8;--ink:#1b2c3b;--muted:#617284;--line:#dce3e9;--teal:#146c68;--orange:#c16c36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:auto;padding:28px 24px 60px}header{padding:26px 30px;background:#173e49;border-radius:18px;color:#fff}h1{font-size:30px;margin:8px 0}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}.eyebrow{font-size:12px;letter-spacing:.16em}.scope{opacity:.8}.verdict{display:inline-block;background:#fff;color:#173e49;padding:7px 14px;border-radius:8px;font-weight:700}nav{display:flex;gap:8px;margin:22px 0}button{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:10px 20px;font:inherit;cursor:pointer}button[aria-selected=true]{background:var(--teal);color:white;border-color:var(--teal)}section.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:18px;background:white}.number{font-size:26px;font-weight:700;color:var(--teal)}.muted,small{color:var(--muted)}.badge{float:right;font-size:12px;background:#edf2f4;border-radius:6px;padding:2px 8px}.table{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}p{margin:7px 0 12px;white-space:pre-line}details{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}summary{cursor:pointer;color:var(--teal)}ul{padding-left:22px}li{margin:7px 0}.empty{padding:26px;color:var(--muted);background:#f6f8fa;border-radius:8px}.warn{background:#fff2d8;color:#744707;padding:10px 18px;margin-bottom:12px;border-radius:8px}svg{width:100%;height:220px;display:block}.bar{display:flex;height:28px;border-radius:7px;overflow:hidden;margin:14px 0}.bar span{min-width:0}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}footer{color:var(--muted);font-size:12px;padding-top:20px}[hidden]{display:none!important}a{color:var(--teal)}
.reading-guide{color:var(--muted);font-size:14px;margin:0 0 20px}.verification-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.verify-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}.verify-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.step{color:var(--teal);font-size:20px;font-weight:750}.dimension{font-size:13px;color:var(--muted)}.state{margin-left:auto;padding:3px 10px;border-radius:6px;background:#edf3f3;color:var(--teal);font-size:12px}.verify-card h3{font-size:19px;margin:0 0 9px}.verify-conclusion{font-size:15px;min-height:3.4em}.verify-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:#f5f8fa;border-radius:9px;padding:12px;margin:6px 0 18px}.verify-metrics dt{font-size:12px;color:var(--muted)}.verify-metrics dd{margin:4px 0 0;font-size:16px;font-weight:650;overflow-wrap:anywhere}.verify-action{margin-top:auto;border-left:3px solid #7bada7;padding:0 0 0 12px}.verify-action strong{font-size:12px;color:var(--teal)}.verify-action p{font-size:14px;margin:3px 0 0}.evidence{font-size:12px;color:var(--muted)}.evidence summary{font-size:12px}.verify-card .evidence{margin-top:16px}
@media(max-width:760px){main{padding:14px 12px}header{padding:20px}h1{font-size:24px}.grid,.verification-grid{grid-template-columns:1fr}.verify-card{padding:18px}.verify-conclusion{min-height:0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}section.panel{padding:16px}.number{font-size:22px}nav button{flex:1;padding:10px 8px}}
.verification-table table{min-width:830px;table-layout:fixed}.verification-table th:nth-child(1){width:12%}.verification-table th:nth-child(2){width:39%}.verification-table th:nth-child(3){width:22%}.verification-table th:nth-child(4){width:27%}.verification-table tbody th{color:var(--ink);font-weight:400}.question{display:block;font-size:12px;margin-top:7px}.verification-table td{white-space:pre-line}.verification-table .state{display:inline-block;margin:0;white-space:nowrap}.gap-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:24px}.gap-count{display:inline-block;padding:1px 8px;background:#fff0dc;color:#935b21;border-radius:6px;font-size:12px;margin-left:8px}.gap-item{display:flex;gap:14px;background:#fffaf2;border:1px solid #eddec4;border-radius:10px;padding:17px;margin-top:12px}.gap-index{font-weight:700;color:#a66b30}.gap-item h3{font-size:15px;margin:0}.gap-item dl{margin:12px 0 0}.gap-item dl div{margin-top:7px}.gap-item dt{color:var(--muted);font-size:12px}.gap-item dd{margin:1px 0 0;font-size:14px}.action-plan{background:#f4f8f8;padding:18px;border-radius:10px}.action-plan ul{padding-left:18px;margin-bottom:0}.chart-scroll{overflow-x:auto;padding:4px 0 0}.histogram{width:100%;height:auto;display:block}.chart-caption{color:var(--muted);font-size:13px;margin:0 0 12px}.chart-axis{stroke:#a9b8c2;stroke-width:1;fill:none}.chart-gridline{stroke:#e7edf1;stroke-width:1}.chart-tick{fill:#6b7c88;font-size:11px;font-family:inherit}.histogram-bar{fill:#287c77;transition:fill .15s}.bar-mark:hover .histogram-bar,.bar-mark:focus .histogram-bar{fill:#c16c36}.bar-value{fill:#244c51;font-size:13px;font-weight:650;font-family:inherit}.bar-mark:focus{outline:none}.bar-mark:focus .histogram-bar{stroke:#173e49;stroke-width:2}
.priority-action{padding:12px 18px;background:#eaf3f2;border-radius:9px}.hero-decision{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:16px;margin-top:18px}.hero-decision .verdict{white-space:nowrap;margin-top:2px}.hero-summary{margin:0;line-height:1.8;font-size:15px;max-width:880px}.scope-details{margin-top:24px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:10px}.scope-details p{font-size:13px;color:var(--muted);margin:12px 0 0}
@media(max-width:760px){.hero-decision{grid-template-columns:1fr;gap:12px}.hero-decision .verdict{justify-self:start}.hero-summary{font-size:14px}}

@media(max-width:760px){.gap-layout{grid-template-columns:1fr}.verification-table table{min-width:800px}}
.competitor-table td{white-space:pre-line}.competitor-table a{font-weight:650;text-decoration:underline;text-underline-offset:3px}
@media print{nav{display:none}[role=tabpanel][hidden]{display:block!important}header{color:#173e49;background:white}section.panel,.card{break-inside:avoid}}
.series-card,.review-card{padding:18px 0;border-bottom:1px solid var(--line)}.review-card blockquote{margin:12px 0;padding:12px 18px;border-left:3px solid var(--teal);background:#f3f8f7}.review-card blockquote small{display:block}.finding{border-left:3px solid var(--teal);padding:8px 14px;background:#f4f8f8}th,td{overflow-wrap:anywhere}

/* Compact research charts and clear table labels. */
thead th{font-weight:700;color:var(--ink)}
.chart-scroll{max-width:820px;margin:10px 0 14px}
.histogram{width:100%;height:210px;max-height:210px}
.histogram .asin-link{fill:var(--teal);text-decoration:underline}
.asin-link{font-weight:650;text-underline-offset:3px}
section.panel>h3{margin-top:16px}

.limits{border:0;padding:12px 18px}.limits summary{color:inherit}
.keyword-chart{position:relative}.keyword-chart .chart-scroll{max-width:100%}
.keyword-lines{height:240px;width:100%;display:block}
.line-guide{stroke:#617284;stroke-dasharray:3 4;opacity:0;pointer-events:none}
.line-hit:hover .line-guide,.line-hit:focus .line-guide{opacity:.6}
.line-hit{outline:none;cursor:crosshair}
.line-tooltip{position:absolute;z-index:5;top:38px;right:12px;max-width:min(420px,95%);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px #173e4929;padding:12px 16px;pointer-events:none;font-size:13px}
.line-tooltip strong{display:block;margin-bottom:5px}.line-tooltip p{display:flex;justify-content:space-between;gap:18px;margin:3px 0}.line-tooltip b{white-space:nowrap}
@media print{details.limits>*{display:block}.line-tooltip{display:none}}

/* Unified disclosure cards. */
details,details.scope-details,details.warn.limits{margin:14px 0;padding:0;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details>summary{padding:15px 18px;color:var(--teal);font-size:14px;font-weight:600;cursor:pointer}
details[open]>summary{border-bottom:1px solid var(--line)}
details>p,details>ul,details>.table,details>div{margin:14px 18px}
details>details{margin:14px 18px}
.hero-title{display:flex;gap:20px;align-items:center;margin:14px 0 22px}.hero-title h1{margin-top:0}
.product-image{display:block;width:76px;height:76px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:white}
.missing-image{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:400}
.hero-product .product-image{width:104px;height:104px}
.hero-conclusion,.hero-reasons,.hero-scope{margin-top:16px;padding-top:16px;border-top:1px solid #ffffff2b}
header h3{font-size:13px;letter-spacing:.04em;color:#c9e3e4;margin-bottom:7px}
.hero-reasons ul{padding-left:20px;margin:5px 0}.hero-reasons li{margin:5px 0}.hero-scope p{margin-bottom:0}
.signal-note{font-size:12px;margin:8px 0 0}.product-image-link{display:inline-block}
@media(max-width:760px){.hero-title{gap:12px;align-items:flex-start}.hero-product .product-image{width:76px;height:76px}.hero-title h1{font-size:21px}.hero-summary{line-height:1.9}}

.kpis>.card{position:relative;display:flex;flex-direction:column;min-height:152px;padding:18px}.kpis>.card>small:first-of-type{display:flex;align-items:center;min-height:30px;line-height:1.4}.kpis>.card>.number{margin:10px 0 4px;line-height:1.3}.kpis>.card>small:last-child{margin-top:auto}.profit-kpi>small:first-of-type{padding-right:62px}.calculator-toggle{position:absolute;right:12px;top:18px;padding:3px 10px;font-size:12px;color:var(--teal)}
.calc-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.calc-fields label{font-size:12px;color:var(--muted)}.calc-fields input,.calc-fields select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit;color:var(--ink);background:white}.calc-result{display:block;white-space:pre-line;padding:15px;margin-top:14px;background:#edf5f3;border-radius:9px}
.series-card a:has(.product-image),.competitor-table a:has(.product-image),.review-card a:has(.product-image){display:inline-flex;align-items:center;gap:9px;vertical-align:middle}
.series-card .product-image,.competitor-table .product-image,.review-card .product-image{width:48px;height:48px;flex-shrink:0;font-size:10px}.heading-image{margin-right:10px;text-decoration:none}
@media(max-width:760px){.calc-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}

.verdict.verdict-reject{background:#111;color:#fff}
.calculator-panel{background:#f3f6fa!important;scroll-margin-top:18px}.calc-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.calc-heading h2{margin:0}
.calc-group{min-width:0;margin:16px 0;padding:20px;border:1px solid #d9e3ed;border-radius:14px;background:#fff}.calc-group legend{font-weight:750;font-size:15px;padding:0 8px;color:#203647}.calc-group .calc-fields{gap:18px 20px}
.calculator-panel .calc-fields label{text-align:center;color:#627d9b}.calculator-panel .calc-fields input,.calculator-panel .calc-fields select{text-align:center;min-height:44px;margin-top:8px;border-color:#d9e3ed;border-radius:10px;font-size:16px;font-weight:650}.calculator-panel .calc-fields input:focus,.calculator-panel .calc-fields select:focus{outline:2px solid #8dbbb6;outline-offset:1px}
.calc-actions{display:flex;gap:12px;margin:18px 0}.calc-actions button{font-weight:700}.calc-actions button[type=submit]{background:#117d78;border-color:#117d78;color:#fff;min-width:130px}.calc-close{padding:5px 16px;font-size:13px}
.calc-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:20px;background:white;border:1px solid #d9e3ed;border-radius:14px;text-align:center}.calc-summary strong{display:block;font-size:27px;line-height:1.4;color:#117d78;margin-top:8px}.calculator-panel .calc-result{background:transparent;padding:8px 2px;font-size:13px}.calc-advanced input[name=fba_override_source]{font-size:13px}.calc-advanced .calc-fields{grid-template-columns:1fr 2fr}
.review-card{margin:16px 0;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff}.review-theme{padding:15px 0;border-top:1px solid var(--line)}.review-theme h4{font-size:15px;margin:0 0 5px;font-weight:750}.review-meta{font-size:12px;color:var(--muted)}
@media(max-width:760px){.calc-group{padding:12px}.calc-group .calc-fields{gap:12px}.calc-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.calc-advanced .calc-fields{grid-template-columns:1fr}.kpis>.card{min-height:160px}.profit-kpi>small:first-of-type{padding-right:0}.profit-kpi .calculator-toggle{position:static;order:4;align-self:flex-end;margin-top:6px}.calc-summary strong{font-size:23px}}
</style></head><body><main>@@BODY@@<footer>Kuma Product Research · 市场研究用途 · 数据来源与业务输入可展开查看</footer></main>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')];function selectTab(t){tabs.forEach(b=>{let on=b===t;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;document.getElementById(b.getAttribute('aria-controls')).hidden=!on})}tabs.forEach((b,i)=>{b.addEventListener('click',()=>selectTab(b));b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;selectTab(tabs[j]);tabs[j].focus()}})});

document.querySelectorAll('.keyword-chart').forEach(chart=>{
  const tip=chart.querySelector('.line-tooltip');
  function show(hit){
    const d=JSON.parse(hit.dataset.tip);tip.replaceChildren();
    const title=document.createElement('strong');title.textContent=d.date+' · '+d.unit;tip.append(title);
    d.rows.forEach(row=>{const p=document.createElement('p'),name=document.createElement('span'),v=document.createElement('b');name.textContent=row.keyword;name.style.color=row.color;v.textContent=row.value===null?'待补':row.value;p.append(name,v);tip.append(p)});
    tip.hidden=false;
  }
  chart.querySelectorAll('.line-hit').forEach(hit=>{
    hit.addEventListener('pointerenter',()=>show(hit));hit.addEventListener('focus',()=>show(hit));
    hit.addEventListener('click',()=>show(hit));hit.addEventListener('blur',()=>{tip.hidden=true});
    hit.addEventListener('keydown',e=>{if(e.key==='Escape'){tip.hidden=true;hit.blur()}});
  });
  chart.querySelector('svg').addEventListener('pointerleave',()=>{tip.hidden=true});
});
</script></body></html>
